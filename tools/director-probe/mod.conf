name = director_probe
title = Goanna director probe
description = Throwaway server-only probe for docs/director.md. Calls the engine and framework APIs the director layer relies on, writes director_probe.json to the world directory, and shuts the server down. Never install it on a world anyone plays.
optional_depends = default, mcl_init, mcl_mobs, mobs_mc, mcl_biome_dispatch, mcl_levelgen, mcl_weather, mobs, terrain_diffusion, goanna_server_mod
