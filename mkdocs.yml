# The documentation site, built with Material for MkDocs and published to
# GitHub Pages by .github/workflows/docs.yml. Build it locally with
#   python3 -m venv /tmp/goanna-docs
#   /tmp/goanna-docs/bin/pip install -r tools/docs/requirements.txt
#   /tmp/goanna-docs/bin/mkdocs build --strict
# or serve it with "mkdocs serve". The text style in docs/develop/style.md
# applies to every page.

site_name: Goanna
site_description: A Godot client for Luanti worlds
site_url: https://p0ss.github.io/Goanna/
repo_url: https://github.com/p0ss/Goanna
repo_name: p0ss/Goanna
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Goanna is LGPL-2.1-or-later. Not affiliated with or endorsed by the Luanti project.

# docs/perf holds measurement records and the scripts that made them; the
# scripts name paths inside it, so it stays where it is and is not built.
# The hook points links into it, and into source outside docs/, at GitHub.
exclude_docs: |
  perf/

hooks:
  - tools/docs/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

