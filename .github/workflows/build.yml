# Build Goanna on a clean machine.
#
# The point of this job is not to test behaviour, it is to catch the two
# things that break a fresh clone and that nobody notices on a developer's
# own machine: a host dependency that is documented nowhere, and a source
# file listed in CMakeLists.txt that was never committed.
#
# There is no run job yet. Goanna needs a Luanti server and, at present, a
# one time editor pass to register the extension. See docs/building.md.

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux, GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Kept in step with the dependency table in docs/building.md. If you
      # change one, change the other.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 zlib1g-dev libzstd-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Check the extension was produced
        run: |
          test -f project/bin/libgoanna.linux.template_debug.x86_64.so
          ls -lh project/bin/

  windows:
    name: Windows, MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # zlib and zstd are not on a stock Windows box. vcpkg manifest mode
      # reads vcpkg.json at the repository root. The triplet is pinned to
      # x64-windows (dynamic CRT) to match godot-cpp's MultiThreadedDLL
      # default; a static triplet here produces a CRT mismatch at link time.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 74e6536215718009aae747d86d84b78376bf9e09

      # No explicit -G. windows-latest moved from a Visual Studio 2022 image
      # to Visual Studio 2026 on 2026-06-08, and "Visual Studio 17 2022" is
      # simply not there any more: the run fails at configure with "could
      # not find any instance of Visual Studio". CMake's Visual Studio
      # generator family auto-selects the newest installed VS when -G is
      # omitted, so this tracks whatever GitHub ships next without another
      # dated fix here. Pin explicitly (currently "Visual Studio 18 2026")
      # only if a specific VS version is ever required.
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Check the extension was produced
        shell: bash
        run: |
          test -f project/bin/libgoanna.windows.template_debug.x86_64.dll
          ls -lh project/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: goanna-windows-x86_64
          path: project/bin/*.dll

  style:
    name: Text style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check house style
        run: tools/check-style.sh
